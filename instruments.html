<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instruments — Lianth Record</title>
<meta name="description" content="Les instruments mis à disposition chez Lianth Record, studio d'enregistrement à Ris-Orangis.">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfdfa;
    --mist:#e9f3ea;
    --sage:#7fa98a;
    --sage-deep:#3c6b50;
    --ink:#1f2b24;
    --muted:#6a7c70;
    --line:rgba(60,107,80,0.14);
    --radius:14px;
    --maxw:1080px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ul{margin:0;padding-left:20px;}
  h1,h2,h3{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;color:var(--sage-deep);}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--sage-deep);outline-offset:3px;border-radius:4px;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px;}

  header{
    padding:20px 0;border-bottom:1px solid var(--line);
    background:rgba(251,253,250,0.9);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:10;
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:var(--maxw);margin:0 auto;padding:0 26px;}
  .logo{font-size:1.2rem;letter-spacing:0.02em;text-decoration:none;color:var(--ink);transition:letter-spacing .5s var(--ease), color .5s var(--ease);}
  .logo:hover{letter-spacing:0.07em;color:var(--sage-deep);}
  .back-link{
    font-family:'IBM Plex Mono',monospace;font-size:0.78rem;text-decoration:none;color:var(--muted);
    display:inline-flex;align-items:center;gap:8px;transition:color .3s var(--ease), gap .3s var(--ease);
  }
  .back-link:hover{color:var(--sage-deep);gap:11px;}

  main{padding:70px 0 100px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--sage);
  }
  .eyebrow::before{content:"";width:20px;height:1px;background:var(--sage);display:inline-block;}
  .page-title{font-size:clamp(2.6rem,7vw,4.4rem);margin-top:14px;margin-bottom:26px;}
  .page-desc{max-width:640px;color:var(--muted);font-size:1.02rem;margin-bottom:56px;}
  .page-desc p + p{margin-top:14px;}
  .page-desc ul{margin-top:8px;color:var(--muted);}
  .page-desc li{margin-bottom:6px;}
  .page-desc strong{color:var(--ink);}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:16px;margin-bottom:60px;}
  .photo-box{
    aspect-ratio:4/3;border:1px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;background:var(--mist);
    color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:0.7rem;
    text-transform:uppercase;letter-spacing:0.08em;text-align:center;padding:12px;
    transition:border-color .4s var(--ease), background .4s var(--ease);
    overflow:hidden;
  }
  .photo-box:hover{border-color:var(--sage);background:#fff;}
  .photo-box img{width:100%;height:100%;object-fit:cover;display:block;}

  .studio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:60px;}
  .studio-card{display:block;text-decoration:none;color:inherit;}
  .studio-card-media{
    position:relative;overflow:hidden;border-radius:12px;
    aspect-ratio:4/3;background:var(--mist);border:1px solid var(--line);
    transition:border-color .5s var(--ease), box-shadow .5s var(--ease);
  }
  .studio-card:hover .studio-card-media{border-color:var(--sage);box-shadow:0 18px 34px -18px rgba(60,107,80,0.32);}
  .studio-card-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease);}
  .studio-card:hover .studio-card-media img{transform:scale(1.08);}
  .studio-card h3{margin-top:14px;font-size:1.05rem;text-align:center;transition:color .4s var(--ease);}
  .studio-card:hover h3{color:var(--sage);}
  @media (max-width:700px){.studio-grid{grid-template-columns:1fr;}}

  .btn{
    display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;
    padding:14px 24px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;
    letter-spacing:0.03em;text-transform:uppercase;text-decoration:none;border:1px solid transparent;
    transition:transform .5s var(--ease), box-shadow .5s var(--ease), letter-spacing .5s var(--ease);
  }
  .btn::before{
    content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform:skewX(-18deg);transition:left .7s var(--ease);pointer-events:none;
  }
  .btn:hover{letter-spacing:0.06em;}
  .btn:hover::before{left:130%;}
  .btn-primary{background:var(--sage-deep);color:var(--paper);}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 28px -10px rgba(60,107,80,0.5);}

  footer{padding:34px 0;border-top:1px solid var(--line);}
  .footer-inner{max-width:var(--maxw);margin:0 auto;padding:0 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
  .footer-links{display:flex;gap:22px;font-size:0.85rem;color:var(--muted);}
  .footer-links a{text-decoration:none;transition:color .3s var(--ease);}
  .footer-links a:hover{color:var(--sage-deep);}
  .footer-meta{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--muted);}

  @media (max-width:600px){
    main{padding:50px 0 70px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="index.html" class="logo">LIANTH RECORD</a>
    <a href="index.html" class="back-link">← Retour au site</a>
  </div>
</header>

<main>
  <div class="wrap">
    <span class="eyebrow">Le studio</span>
    <h1 class="page-title">Instruments</h1>

    <div class="page-desc">
      <p>Une large panoplie d'instruments mis à votre disposition, pour compléter vos productions, ou en créer une toute nouvelle.</p>
    </div>

    <!-- Remplace src="images/..." par tes propres photos pour chaque instrument -->
    <div class="studio-grid">
      <a class="studio-card" href="instruments-batterie.html">
        <div class="studio-card-media">
          <img src="images/lianth1.png" alt="Batterie">
        </div>
        <h3>Batterie</h3>
      </a>
      <a class="studio-card" href="instruments-clavier.html">
        <div class="studio-card-media">
          <img src="images/lianth2.png" alt="Clavier">
        </div>
        <h3>Clavier</h3>
      </a>
      <a class="studio-card" href="instruments-guitare.html">
        <div class="studio-card-media">
          <img src="images/lianth4.png" alt="Guitare">
        </div>
        <h3>Guitare</h3>
      </a>
    </div>

    <a href="index.html#studio-sections" class="btn btn-primary">Lianth Record</a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span class="logo">LIANTH RECORD</span>
    <div class="footer-links">
      <a href="mentions-legales.html">Mentions légales</a>
    </div>
    <span class="footer-meta">© 2026 · Ris-Orangis</span>
  </div>
</footer>

</body>
</html>
